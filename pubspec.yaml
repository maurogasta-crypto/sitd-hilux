name: sitd_hilux
description: "Telemetria, odometria y diagnostico mecanico - Toyota Hilux 3.0"
publish_to: 'none'

# versionName / versionCode del APK. El sello legible de la tanda vive en
# lib/core/version.dart y es el que se muestra en pantalla.
version: 0.1.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # SQLite crudo, sin generacion de codigo.
  #
  # Por que no drift ni sqflite:
  #  - drift resuelve bien los isolates pero exige build_runner, y eso ata
  #    cualquier cambio de esquema a una maquina con la cadena de compilacion
  #    puesta. Este proyecto ya carga con un paso de build; no se le agrega uno
  #    mas para tocar cuatro tablas.
  #  - sqflite no es seguro entre isolates concurrentes, y la aplicacion tiene
  #    tres productores en paralelo (GPS, analisis, interfaz).
  # sqlite3 abre una conexion por isolate contra el mismo archivo y deja que
  # SQLite resuelva la concurrencia en modo WAL, que es para lo que existe.
  # La 3.x ya trae la biblioteca nativa empaquetada: sqlite3_flutter_libs
  # quedo marcado como fin de vida ("Not used anymore, update to version 3.x
  # of package:sqlite3 instead") y no entra.
  sqlite3: ^3.6.0

  path: ^1.9.0
  path_provider: ^2.1.4

  # El GPS y el servicio en primer plano.
  #
  # Se eligio sobre `location` por dos cosas concretas, no por popularidad:
  # entrega `hasSpeed` / `hasAccuracy` —que es lo unico que distingue "no hay
  # velocidad" de "velocidad cero", y de eso depende toda la odometria— y trae
  # la configuracion de la notificacion persistente sin escribir Kotlin.
  #
  # Lo que NO hace, y esta escrito en su propia documentacion: no sobrevive a
  # que el sistema mate la actividad. Contra eso no hay ajuste del complemento,
  # hay dos redes propias — cada punto se guarda apenas llega, y el viaje que
  # quedo abierto se retoma. Ver `fuente_gps.dart`.
  geolocator: ^14.0.3
  sensors_plus: ^7.1.0
  # El selector de archivos del sistema (SAF). Entró en `sitd-24` y el motivo
  # está medido: desde Android 11 NADIE de afuera entra a `Android/data`, ni
  # un gestor de archivos ni Termux —probado en el Redmi 15 el 2026-09-21, con
  # «No such file or directory»—. Sin un selector, un respaldo que está en
  # Descargas o en Drive no se puede volver a meter. Y no pide ningún permiso:
  # el sistema entrega el archivo que la persona eligió, y nada más.
  file_picker: ^13.1.0
  share_plus: ^13.3.0
  wakelock_plus: ^1.8.0
  # El permiso de notificaciones, en tiempo de ejecucion.
  #
  # Desde Android 13 la notificacion del servicio en primer plano necesita
  # POST_NOTIFICATIONS para VERSE, y declararlo en el manifiesto sin pedirlo
  # aca no hace absolutamente nada. Un servicio en primer plano invisible es
  # justo lo que un Xiaomi mata sin que nadie se entere.
  #
  # CLAVADO EN LA 12 A PROPOSITO, y no se sube sin mirar esto: la 13 trae
  # permission_handler_android 14, que exige compilar contra la API 37, y el
  # plugin de Gradle que usa Flutter hoy llega hasta la 36 — el APK no compila
  # y el error habla de AAR metadata, no de este archivo. Ya paso en la corrida
  # 17 del 2026-09-16. La 12 trae la 13.0.1, que compila contra la 35.
  # Se destraba cuando suba el plugin de Gradle, no antes.
  permission_handler: ^12.0.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Sólo para el banco, y por una razón concreta: `fuente_gps_test.dart`
  # vigila un ERROR de este paquete —`AndroidPosition.fromMap` pierde las
  # banderas `hasSpeed` y `hasAccuracy`— y para reproducirlo hay que
  # construir un `AndroidPosition`. Si algún dia se arregla rio arriba, esa
  # prueba empieza a fallar y ahi se puede sacar el rodeo de `loQueTrae`.
  # La aplicacion no lo importa: entra por `geolocator` como siempre.
  geolocator_android: ^5.0.3

flutter:
  uses-material-design: true
