# Compila el APK y lo deja donde se pueda instalar desde el teléfono.
#
# Es lo primero que se armó del proyecto, antes que cualquier función, y el
# motivo es el mismo que ordena el resto del ecosistema: **Mauro trabaja desde
# un teléfono.** Flutter necesita una cadena de compilación que un teléfono no
# tiene, así que sin esto el proyecto entero dependería de estar sentado
# frente a una PC. Acá corre el build, y del teléfono sale un enlace directo al
# APK.
#
# El APK queda en dos lados:
#  - como *artifact* de la corrida, que sirve para revisar una tanda vieja pero
#    baja en .zip y hay que estar con sesión iniciada;
#  - como *release* «ultimo», que da un enlace directo al .apk y se instala
#    tocándolo desde el navegador del teléfono. Ése es el camino de todos los
#    días.

name: APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

env:
  # Clavada a propósito: la misma versión con la que se verificó la tanda.
  # Subirla es un cambio deliberado, no algo que pase solo un martes.
  FLUTTER_VERSION: '3.47.4'

jobs:
  construir:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      # La verificación previa no es opcional (PROTOCOLO-GENERAL § 2.1 ter).
      # Si algo de esto falla, no se construye nada.
      - name: Analizador
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Formato
        run: dart format --output=none --set-exit-if-changed .

      - name: Banco de pruebas
        run: flutter test --reporter expanded

      # ── LA FIRMA ─────────────────────────────────────────────────────────
      # El keystore NO está en el repositorio y no puede estarlo: es público.
      # Llega por Secrets, cargados por Mauro a mano — un chat nunca pide el
      # valor de una credencial ni la carga por API.
      #
      # Si los secretos todavía no están, NO se rompe nada: se compila con la
      # clave de depuración, igual que hasta ahora. Lo que cambia es que se
      # dice en voz alta cuál se usó, porque de eso depende si el APK se puede
      # instalar encima del anterior.
      - name: Preparar la firma
        id: firma
        env:
          FIRMA_JKS: ${{ secrets.FIRMA_JKS }}
          FIRMA_STORE_PASS: ${{ secrets.FIRMA_STORE_PASS }}
          FIRMA_KEY_PASS: ${{ secrets.FIRMA_KEY_PASS }}
          FIRMA_ALIAS: ${{ secrets.FIRMA_ALIAS }}
        run: |
          if [ -z "$FIRMA_JKS" ]; then
            echo "propia=no" >> "$GITHUB_OUTPUT"
            echo "::warning::Sin FIRMA_JKS: se firma con la clave de depuración, que se genera nueva en cada corrida. Este APK NO se va a poder instalar encima del anterior."
            exit 0
          fi
          # `base64 -d` falla con un salto de línea de más; se limpian antes.
          printf '%s' "$FIRMA_JKS" | tr -d '\n' | base64 -d > android/app/firma.jks
          cat > android/key.properties <<PROPS
          storeFile=firma.jks
          storePassword=$FIRMA_STORE_PASS
          keyAlias=${FIRMA_ALIAS:-sitd}
          keyPassword=${FIRMA_KEY_PASS:-$FIRMA_STORE_PASS}
          PROPS
          echo "propia=si" >> "$GITHUB_OUTPUT"
          echo "Firmando con la clave propia."

      - name: Construir APK
        # El número de corrida entra como versionCode: sube en cada tanda y
        # nunca retrocede, que es lo que Android exige para tratar una
        # instalación como actualización. Con el 1 clavado del pubspec, dos
        # APK distintos decían ser la misma versión.
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Renombrar con el número de corrida
        run: |
          mkdir -p entrega
          cp build/app/outputs/flutter-apk/app-release.apk \
             "entrega/sitd-hilux-${{ github.run_number }}.apk"
          # Y una segunda copia con nombre FIJO. Son el mismo archivo y las dos
          # tienen razón de ser: el numerado dice de qué corrida salió —sirve
          # para volver a una tanda vieja—, y el fijo es el único que se puede
          # enlazar desde afuera. El panel guarda esa dirección, y con sólo el
          # nombre numerado habría que ir a corregirla en cada tanda; una
          # dirección que hay que acordarse de actualizar es una dirección que
          # un día apunta a un archivo que ya no está.
          cp build/app/outputs/flutter-apk/app-release.apk entrega/sitd-hilux.apk
          ls -lh entrega/

      - uses: actions/upload-artifact@v4
        with:
          name: sitd-hilux-${{ github.run_number }}
          path: entrega/sitd-hilux-${{ github.run_number }}.apk
          retention-days: 90

      # El release rodante sólo se toca desde main: un PR no publica nada.
      - name: Publicar el último APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
          CORRIDA: ${{ github.run_number }}
          FIRMA_PROPIA: ${{ steps.firma.outputs.propia }}
        run: |
          if [ "$FIRMA_PROPIA" = "si" ]; then
            NOTA_DE_FIRMA="Firmado con la clave propia del proyecto: se instala ENCIMA de la versión anterior, sin desinstalar y sin perder los datos."
          else
            NOTA_DE_FIRMA="⚠ Firmado con la clave de DEPURACIÓN, que se genera nueva en cada corrida: este APK no se puede instalar encima del anterior. Android va a decir «conflicto con un paquete», y hay que desinstalar — lo que BORRA los datos. Se arregla cargando el secreto FIRMA_JKS (ver hilux:F1)."
          fi
          # Las notas van por archivo y no por --notes en línea: una cadena
          # multilínea dentro del YAML arrastra la indentación, y cuatro
          # espacios en Markdown convierten el texto en un bloque de código.
          cat > notas.md <<NOTAS
          Compilado de \`$SHA\` el $(date -u '+%Y-%m-%d %H:%M UTC').

          Se instala tocando el \`.apk\` de acá abajo desde el navegador del
          teléfono. La primera vez Android va a pedir permiso para instalar
          desde esa fuente.

          $NOTA_DE_FIRMA
          NOTAS

          gh release delete ultimo --yes --cleanup-tag || true
          gh release create ultimo \
            --title "Último APK (corrida $CORRIDA)" \
            --notes-file notas.md \
            --prerelease \
            entrega/*.apk
